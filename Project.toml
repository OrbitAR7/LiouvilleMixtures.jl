[sources]
OrbitalMechanics = {url = "https://github.com/OrbitAR7/orbital-mechanics-jl", rev = "98a43ae50553149c8d9322e7768f2193ee23c4d2"}

[compat]
LinearAlgebra = "1"
OrbitalMechanics = "1"
